name: Bootstrap archived source

on:
  push:
    branches:
      - restructure/auditable-reproducibility
    paths:
      - .github/workflows/bootstrap-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate archive paths
        shell: bash
        run: |
          python - <<'PY'
          import tarfile
          from pathlib import PurePosixPath

          archive = "PAPER.tar.gz"
          with tarfile.open(archive, "r:gz") as tf:
              members = tf.getmembers()
              if not members:
                  raise SystemExit("Archive is empty")
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Unsafe archive path: {member.name}")
              print(f"Validated {len(members)} archive members")
          PY

      - name: Extract original archive for provenance
        shell: bash
        run: |
          rm -rf legacy
          mkdir -p legacy
          tar -xzf PAPER.tar.gz -C legacy
          echo "Extracted tree:"
          find legacy -maxdepth 4 -type f -print | sort

      - name: Commit extracted source on the working branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legacy
          if git diff --cached --quiet; then
            echo "No extracted-source changes to commit."
            exit 0
          fi
          git commit -m "chore: unpack published source archive for audit"
          git push origin HEAD
